<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kakus - Estadísticas</title>

    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/stats.css">

    <script src="../js/global.js"></script>
</head>

<body>

    <!-- Encabezado -->
    <header class="main-header py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mt-1">
                <h1 class="text-dark fs-1 fw-bold mb-0">
                    Resumen Duo
                </h1>

                <div
                    class="bg-light rounded-circle p-2 d-flex justify-content-center align-items-center"
                    style="width: 40px; height: 40px;"
                >
                    <i class="bi bi-calendar3 text-secondary"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container py-4">

        <!-- Selector de mes -->
        <div
            class="d-flex justify-content-between align-items-center bg-light rounded-pill px-3 py-2 mb-4 mx-auto"
            style="max-width: 300px;"
        >
            <button
                type="button"
                class="btn btn-link text-muted p-0 border-0"
                onclick="changeMonth(-1)"
                aria-label="Mes anterior"
            >
                <i class="bi bi-chevron-left fs-5"></i>
            </button>

            <span class="fw-bold d-flex align-items-center text-dark">
                <span class="dot me-2" style="color: #105d9c;">●</span>
                <span id="current-month">Cargando...</span>
            </span>

            <button
                type="button"
                class="btn btn-link text-muted p-0 border-0"
                id="next-month-button"
                onclick="changeMonth(1)"
                aria-label="Mes siguiente"
            >
                <i class="bi bi-chevron-right fs-5"></i>
            </button>
        </div>

        <!-- Tarjeta del ganador -->
        <section
            class="card border-0 shadow-sm rounded-4 p-4 mb-3"
            style="background-color: #ffffff;"
        >

            <div class="d-flex justify-content-between align-items-start mb-4">
                <div class="d-flex align-items-center">
                    <span class="fs-1 me-3">👑</span>

                    <div>
                        <span
                            class="text-uppercase fw-bold"
                            style="font-size: 0.75rem; letter-spacing: 1px; color: #105d9c;"
                        >
                            Ganador de
                            <span id="winner-month">...</span>
                        </span>

                        <h4
                            class="fw-bold mb-0 text-dark"
                            id="winner-text"
                        >
                            Cargando estadísticas...
                        </h4>

                        <span
                            id="winner-diff"
                            class="badge rounded-pill mt-2"
                            style="background-color: #e8f3fc; color: #105d9c;"
                        >
                            +0
                        </span>
                    </div>
                </div>
            </div>

            <!-- Puntuaciones de ambos usuarios -->
            <div
                class="rounded-pill d-flex justify-content-between align-items-center px-3 py-3 mb-4"
                style="background-color: #f8fafc;"
            >

                <!-- Usuario 1 -->
                <div class="text-center" style="flex: 1; min-width: 0;">
                    <span class="small fw-bold text-muted">
                        <span style="color: #105d9c;">●</span>
                        <span id="label-sam">Usuario 1</span>
                    </span>

                    <h2
                        class="fw-bold mb-0"
                        style="color: #105d9c;"
                        id="score-sam"
                    >
                        0
                    </h2>
                </div>

                <div
                    class="text-muted fw-bold small text-center"
                    style="flex: 0.5;"
                >
                    VS
                </div>

                <!-- Usuario 2 -->
                <div class="text-center" style="flex: 1; min-width: 0;">
                    <span class="small fw-bold text-muted">
                        <span style="color: #f53a3a;">●</span>
                        <span id="label-alex">Usuario 2</span>
                    </span>

                    <h2
                        class="fw-bold mb-0"
                        style="color: #f53a3a;"
                        id="score-alex"
                    >
                        0
                    </h2>
                </div>

            </div>

            <!-- Barra de progreso mensual -->
            <div
                class="progress rounded-pill mb-3"
                style="height: 10px; background-color: #f1f5f9;"
                role="progressbar"
                aria-label="Comparación de visitas mensuales"
            >
                <div
                    id="bar-sam"
                    class="progress-bar"
                    style="width: 50%; background-color: #105d9c;"
                ></div>

                <div
                    id="bar-alex"
                    class="progress-bar"
                    style="width: 50%; background-color: #f53a3a;"
                ></div>
            </div>

            <!-- Totales y porcentajes -->
            <div class="d-flex justify-content-between align-items-center small mt-2">
                <span class="text-muted">
                    Total:
                    <span
                        class="text-dark fw-bold"
                        id="total-visits"
                    >
                        0 visitas
                    </span>
                </span>

                <span
                    class="text-muted text-end"
                    id="percentage-text"
                >
                    50.0% vs 50.0%
                </span>
            </div>

        </section>

        <!-- Tarjeta de récord diario -->
        <section
            class="card border-0 shadow-sm rounded-4 p-4 mb-4"
            style="background-color: #ffffff;"
        >

            <div class="d-flex align-items-center justify-content-between">

                <div class="d-flex align-items-center">

                    <div
                        class="rounded-circle d-flex justify-content-center align-items-center me-3 flex-shrink-0"
                        style="width: 45px; height: 45px; background-color: #fef2f2; color: #ef4444;"
                    >
                        <i class="bi bi-lightning-charge-fill fs-5"></i>
                    </div>

                    <div>
                        <span class="text-muted small fw-bold">
                            Récord en 1 día ⚡
                        </span>

                        <h5
                            class="fw-bold mb-0 text-dark mt-1"
                            id="record-text"
                        >
                            Cargando récord...
                        </h5>
                    </div>

                </div>

                <span class="fs-2 ms-2">🚽</span>

            </div>

        </section>

    </main>

    <!-- Navegación inferior -->
    <nav class="bottom-nav">

        <a href="index.html" class="nav-item">
            <span class="nav-icon">
                <i class="bi bi-house-door"></i>
            </span>
            <span class="nav-label">Inicio</span>
        </a>

        <a href="stats.html" class="nav-item active">
            <span class="nav-icon">
                <i class="bi bi-bar-chart-fill"></i>
            </span>
            <span class="nav-label">Estadística</span>
        </a>

        <a href="settings.html" class="nav-item">
            <span class="nav-icon">
                <i class="bi bi-gear"></i>
            </span>
            <span class="nav-label">Ajuste</span>
        </a>

    </nav>

    <!-- Librerías y JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/stats.js"></script>

</body>
</html>
