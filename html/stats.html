<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadisticas</title>
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons (liviano) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/stats.css">
    <script src="../js/global.js"></script>
</head>
<body>
    <header class="main-header py-3">
        <div class="container">
            
            <div class="d-flex justify-content-between align-items-center mt-1">
                <h1 class="text-dark fs-1 fw-bold mb-0">Resumen Duo</h1>
                <div class="bg-light rounded-circle p-2 d-flex justify-content-center align-items-center" style="width: 40px; height: 40px;">
                    <i class="bi bi-calendar3 text-secondary"></i>
                </div>
            </div>
        </div>
    </header>

    <main class="container py-4">
        <!-- Selector de Mes -->
        <div class="d-flex justify-content-between align-items-center bg-light rounded-pill px-3 py-2 mb-4 mx-auto" style="max-width: 300px;">
            <i class="bi bi-chevron-left text-muted fs-5" style="cursor:pointer;" onclick="changeMonth(-1)"></i>
            <span class="fw-bold d-flex align-items-center text-dark">
                <span class="dot me-2" style="color: #105d9c;">●</span> <span id="current-month">Octubre 2024</span>
            </span>
            <i class="bi bi-chevron-right text-muted fs-5" style="cursor:pointer;" onclick="changeMonth(1)"></i>
        </div>

        <!-- Tarjeta Ganador -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-3" style="background-color: #ffffff;">
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div class="d-flex align-items-center">
                    <span class="fs-1 me-3">👑</span>
                    <div>
                        <span class="text-uppercase fw-bold" style="font-size: 0.75rem; letter-spacing: 1px; color: #105d9c;">Ganador de <span id="winner-month">Octubre</span></span>
                        <h4 class="fw-bold mb-0 text-dark" id="winner-text">Sam lidera el trono</h4>
                    </div>
                </div>
                
            </div>

            <!-- Scores -->
            <div class="rounded-pill d-flex justify-content-between align-items-center px-4 py-3 mb-4" style="background-color: #f8fafc;">
                <div class="text-center" style="flex: 1;">
                    <span class="small fw-bold text-muted"><span style="color: #105d9c;">●</span> Sam</span>
                    <h2 class="fw-bold mb-0" style="color: #105d9c;" id="score-sam">142</h2>
                </div>
                <div class="text-muted fw-bold small text-center" style="flex: 0.5;">VS</div>
                <div class="text-center" style="flex: 1;">
                    <span class="small fw-bold text-muted"><span style="color: #f53a3a;">●</span> Alex</span>
                    <h2 class="fw-bold mb-0" style="color: #f53a3a;" id="score-alex">128</h2>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress rounded-pill mb-3" style="height: 10px; background-color: #f1f5f9;">
                <div id="bar-sam" class="progress-bar rounded-pill" role="progressbar" style="width: 52.6%; background-color: #105d9c;"></div>
                <div id="bar-alex" class="progress-bar rounded-pill" role="progressbar" style="width: 47.4%; background-color: #f53a3a;"></div>
            </div>

            <!-- Totals -->
            <div class="d-flex justify-content-between align-items-center small mt-2">
                <span class="text-muted">Total: <span class="text-dark fw-bold" id="total-visits">270 visitas</span></span>
                <span class="text-muted" id="percentage-text">52.6% vs 47.4%</span>
            </div>
        </div>

        <!-- Tarjeta Récord -->
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4" style="background-color: #ffffff;">
            <div class="d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle d-flex justify-content-center align-items-center me-3" style="width: 45px; height: 45px; background-color: #fef2f2; color: #ef4444;">
                        <i class="bi bi-lightning-charge-fill fs-5"></i>
                    </div>
                    <div>
                        <span class="text-muted small fw-bold">Récord en 1 día ⚡</span>
                        <h5 class="fw-bold mb-0 text-dark mt-1" id="record-text">Alex con 9 visitas</h5>
                    </div>
                </div>
                <span class="fs-2">🍕</span>
            </div>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon"><i class="bi bi-house-door"></i></span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="#" class="nav-item active">
            <span class="nav-icon"><i class="bi bi-bar-chart-fill"></i></span>
            <span class="nav-label">Estadística</span>
        </a>
        <a href="settings.html" class="nav-item">
            <span class="nav-icon"><i class="bi bi-gear"></i></span>
            <span class="nav-label">Ajuste</span>
        </a>
    </nav>

    <script src="../js/stats.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx6Hk+gWpGz5sE5Z1mUpmsaSmqM6pmsV3y4pGekfvXvWz8i1c+z" crossorigin="anonymous"></script>
</body>
</html>
