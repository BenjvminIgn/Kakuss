<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Kakus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/theme.css">
     <script src="../js/theme.js"></script>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>
<body>
    <!-- Encabezado -->
    <header class="main-header py-3">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mt-1">
                <h1 class="text-dark fs-1 fw-bold mb-0">Inicio de Sesión</h1>

                <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar modo oscuro">
                    <i class="bi bi-moon-stars-fill"></i>
                </button>
            </div>
        </div>
    </header>
    
<div class="container pt-5">
    <div class="card">
        <div class="card-body">
            <h3 class="card-title text-center fw-bold">¡Bienvenido a Kakus!</h3>
            <p class="parrafo text-center">¿Quién tira más la cadena?</p>

            <!-- Agregamos un ID al formulario para controlarlo -->
            <form id="login-form">
                <input 
                    class="form-control mb-2" 
                    type="text" 
                    id="username"
                    name="username"
                    required
                    placeholder="Ingresa un nombre"
                    aria-label="default input example"
                >
                <!-- Mensaje de error oculto por defecto -->
                <div id="error-message" class="text-danger small mb-3" style="display: none;"></div>

                <button class="btn-login w-100" type="submit">Entrar</button>
            </form>
        </div>
    </div>
</div>

<!-- Ola decorativa en el fondo -->
<div class="wave-container">
    <svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 200" preserveAspectRatio="none">
        <path fill="#c3cfe2" fill-opacity="0.5" d="M0,64L48,80C96,96,192,128,288,128C384,128,480,96,576,85.3C672,75,768,85,864,96C960,107,1056,117,1152,112C1248,107,1344,85,1392,74.7L1440,64L1440,200L1392,200C1344,200,1248,200,1152,200C1056,200,960,200,864,200C768,200,672,200,576,200C480,200,384,200,288,200C192,200,96,200,48,200L0,200Z"/>
        <path fill="#ff6b6b" fill-opacity="0.15" d="M0,128L48,117.3C96,107,192,85,288,90.7C384,96,480,128,576,133.3C672,139,768,117,864,106.7C960,96,1056,96,1152,112C1248,128,1344,160,1392,176L1440,192L1440,200L1392,200C1344,200,1248,200,1152,200C1056,200,960,200,864,200C768,200,672,200,576,200C480,200,384,200,288,200C192,200,96,200,48,200L0,200Z"/>
    </svg>
</div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/login.js"></script>
</body>
</html>
