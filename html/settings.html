<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kakus - Ajustes</title>

    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/sf-pro-display">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <!-- CSS Ordenado -->
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="global.css">
    
    <!-- Global JS al head para aplicar tema oscuro rápido -->
    <script src="global.js"></script>
</head>
<body>
    <header class="main-header py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="text-dark fs-1 fw-bold mb-0">Ajustes</h1>
        </div>
    </header>

    <main class="container py-4">
        <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
            <h6 class="fw-bold text-dark mb-3">Apariencia</h6>
            
            <div class="d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <div class="rounded-circle d-flex justify-content-center align-items-center me-3 bg-light text-dark" style="width: 45px; height: 45px;">
                        <i class="bi bi-moon-stars-fill fs-5"></i>
                    </div>
                    <div>
                        <span class="fw-bold text-dark d-block">Modo Oscuro</span>
                        <span class="small text-muted">Cambiar el tema de la aplicación</span>
                    </div>
                </div>
                
                <div class="form-check form-switch fs-4 mb-0">
                    <input class="form-check-input" type="checkbox" role="switch" id="theme-switch" style="cursor: pointer;">
                </div>
            </div>
        </div>
    </main>

    <!-- Barra de navegación inferior -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon"><i class="bi bi-house-door"></i></span>
            <span class="nav-label">Inicio</span>
        </a>
        <a href="stats.html" class="nav-item">
            <span class="nav-icon"><i class="bi bi-bar-chart"></i></span>
            <span class="nav-label">Estadística</span>
        </a>
        <a href="settings.html" class="nav-item active">
            <span class="nav-icon"><i class="bi bi-gear-fill"></i></span>
            <span class="nav-label">Ajuste</span>
        </a>
    </nav>

    <script src="settings.js"></script>
</body>
</html>
